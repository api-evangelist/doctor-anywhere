aid: doctor-anywhere
name: Doctor Anywhere
description: 'Doctor Anywhere is a Singapore-headquartered, tech-led regional healthcare
  company founded in 2015 that delivers telehealth and in-person care to more than 2.8
  million users across Southeast Asia — Singapore, Malaysia, Thailand, the Philippines
  and Indonesia. Its consumer app and web properties cover 24-hour virtual GP clinics,
  specialist and mental-wellness teleconsults, doctor house calls, DA Clinics, health
  screenings, vaccinations, childhood immunisation, chronic-disease and weight-management
  programmes, medication delivery, the DA Marketplace health-products storefront, DA
  MedSuites screening and imaging, and corporate wellness and pre-employment screening
  for employers. Doctor Anywhere does not operate a public developer portal or publish
  an OpenAPI definition; its platform APIs run behind an Apigee gateway serving its own
  apps, while its regional marketing sites (Malaysia, Thailand, Indonesia) publish an
  llms.txt and expose an anonymous Model Context Protocol endpoint for agent access to
  public site content.'
