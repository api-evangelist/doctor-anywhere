tools:
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone and address.
  input_schema_properties: []
  required: []
- name: SearchInSite
  description: Searches the site for information.
  input_schema_properties: [searchTerm]
  required: [searchTerm]
- name: SearchSiteApiDocs
  description: Retrieves the API documentation for the Wix business solutions installed
    on this site and informs the AI client how to use those APIs.
  input_schema_properties: [searchTerm]
  required: [searchTerm]
- name: GenerateVisitorToken
  description: Creates a new visitor session and obtains a visitor access token for the
    site. Must be called before any CallWixSiteAPI request.
  input_schema_properties: []
  required: []
- name: CallWixSiteAPI
  description: Calls API methods on the site to perform actions on a visitor's behalf,
    such as querying site data, booking an appointment or starting a purchase.
  input_schema_properties: [visitorToken, url, method, body]
  required: [visitorToken, url, method]
- name: ExecuteWixAPI
  description: Executes code against the Wix site APIs on a visitor's behalf.
  input_schema_properties: [code, reason, hasMutations, sourceDocUrls, visitorToken]
  required: [code, reason, hasMutations, sourceDocUrls, visitorToken]
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  input_schema_properties: [articleUrl]
  required: [articleUrl]
- name: ReadFullDocsMethodSchema
  description: Fetches the full schema for a Wix API method.
  input_schema_properties: [articleUrl, reason]
  required: [articleUrl, reason]
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST documentation menu.
  input_schema_properties: [menuUrl, reason]
  required: [reason]
capabilities_published:
- Get business details (contact info, location, hours)
- Discover products and services on offer
- Book services and make reservations
- Start a purchase and be directed to the site to complete checkout
- Ask questions and get answers without browsing the site
